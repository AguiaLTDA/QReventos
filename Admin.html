<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #1f2937; }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 560px; margin: 0 auto 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    button { margin-top: 16px; background: #2563eb; color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    a.btn-link { color: #2563eb; text-decoration: none; font-weight: 600; }
    #msg { margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Novo evento</h1>
    <div class="sub">Cadastre um evento para gerar seu QR Code de presença dinâmico.</div>
    <label>Título do evento</label>
    <input id="titulo" placeholder="Ex: Palestra de Empreendedorismo">
    <label>Data</label>
    <input id="data" type="date">
    <label>Carga horária (horas)</label>
    <input id="cargaHoraria" type="number" min="1" placeholder="Ex: 2">
    <button onclick="criar()">Cadastrar evento</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h1>Eventos cadastrados</h1>
    <table id="tabela">
      <thead><tr><th>Título</th><th>Data</th><th>Horas</th><th>QR</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const baseUrl = "<?= baseUrl ?>";

    function criar() {
      const titulo = document.getElementById('titulo').value.trim();
      const data = document.getElementById('data').value;
      const cargaHoraria = document.getElementById('cargaHoraria').value;
      if (!titulo || !data || !cargaHoraria) {
        document.getElementById('msg').innerHTML = '<span style="color:#dc2626">Preencha todos os campos.</span>';
        return;
      }
      document.getElementById('msg').innerText = 'Salvando...';
      google.script.run
        .withSuccessHandler(function () {
          document.getElementById('msg').innerHTML = '<span style="color:#16a34a">Evento criado!</span>';
          document.getElementById('titulo').value = '';
          document.getElementById('data').value = '';
          document.getElementById('cargaHoraria').value = '';
          carregarEventos();
        })
        .withFailureHandler(function (err) {
          document.getElementById('msg').innerHTML = '<span style="color:#dc2626">Erro: ' + err.message + '</span>';
        })
        .criarEvento({ titulo: titulo, data: data, cargaHoraria: cargaHoraria });
    }

    function carregarEventos() {
      google.script.run.withSuccessHandler(function (eventos) {
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        eventos.forEach(function (ev) {
          const tr = document.createElement('tr');
          const link = baseUrl + '?page=display&evento=' + ev.id;
          tr.innerHTML = '<td>' + ev.titulo + '</td><td>' + ev.data + '</td><td>' + ev.cargaHoraria + '</td>' +
            '<td><a class="btn-link" href="' + link + '" target="_blank">Abrir QR</a></td>';
          tbody.appendChild(tr);
        });
      }).listarEventos();
    }

    carregarEventos();
  </script>
</body>
</html>
